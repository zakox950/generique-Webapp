<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Spyfi Admin — Aperçu mobile</title>
<style>
  body{margin:0;background:#0e1416;font-family:'Geist',system-ui,sans-serif;color:#F2EFE2;padding:28px 16px 60px;}
  h1{font-size:1.3rem;font-weight:600;text-align:center;margin:0 0 4px;}
  p.sub{text-align:center;color:rgba(242,239,226,.5);font-size:.82rem;margin:0 0 28px;}
  .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;}
  .phone{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .screen{width:380px;height:800px;border-radius:42px;padding:10px;background:#1c2426;box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.05);}
  .screen iframe{width:100%;height:100%;border:0;border-radius:32px;background:#11181a;}
  .cap{font-size:.78rem;color:rgba(242,239,226,.6);font-weight:500;}
</style></head>
<body>
  <h1>Spyfi Admin — version mobile</h1>
  <p class="sub">Sous 768px : sidebar masquée, marque dans la topbar, bottom nav pill Liquid Glass (se masque au scroll), grilles adaptées.</p>
  <div class="row">
    <div class="phone"><div class="screen"><iframe src="Spyfi Admin.html"></iframe></div><span class="cap">Dashboard</span></div>
    <div class="phone"><div class="screen"><iframe src="Commandes.html"></iframe></div><span class="cap">Commandes</span></div>
    <div class="phone"><div class="screen"><iframe src="Configuration.html"></iframe></div><span class="cap">Configuration</span></div>
  </div>
