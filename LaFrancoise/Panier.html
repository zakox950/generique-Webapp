<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon panier — Pâtisserie Françoise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>
<div class="bg-blob bg-blob-3"></div>

<div class="shell">
  <header class="app-header">
    <a href="Accueil.html" class="brand">Pâtisserie <span>Françoise</span></a>
    <a href="Panier.html" class="cart-btn" aria-label="Panier">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span class="cart-count" data-cart-count>0</span>
    </a>
  </header>

  <main class="content">
    <div class="page-head" data-screen-label="panier">
      <div class="eyebrow">Votre commande</div>
      <h1 class="section-title">Mon panier</h1>
    </div>
    <div id="cartArea"></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav">
  <a class="nav-item" href="Accueil.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    Accueil
  </a>
  <a class="nav-item" href="Catalogue.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>
    Catalogue
  </a>
  <a class="nav-item active" href="Panier.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    Panier
    <span class="nav-badge" data-cart-count>0</span>
  </a>
  <a class="nav-item" href="Contact.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H7l-3 3V4Z"/></svg>
    Contact
  </a>
</nav>

<script src="app.js"></script>
<script>
  const ICON_MINUS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M5 12h14"/></svg>';
  const ICON_PLUS2 = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  const area = document.getElementById('cartArea');

  function render(){
    const cart = getCart();
    const ids = Object.keys(cart);
    if(ids.length === 0){
      area.innerHTML = `
        <div class="cart-empty">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <div class="t">Votre panier est vide</div>
          <div class="d">Laissez-vous tenter par une viennoiserie ou un entremets du jour.</div>
          <a class="btn-primary" href="Catalogue.html">Parcourir le catalogue</a>
        </div>`;
      return;
    }
    const rows = ids.map(id=>{
      const p = productById(id);
      const q = cart[id];
      return `<div class="cart-row">
        <div class="cart-thumb"><img src="${IMG(p.photo,160)}" alt="${p.name}" onerror="this.style.display='none'"></div>
        <div class="cart-info">
          <div class="n">${p.name}</div>
          <div class="u">${fmt(p.price)} l'unité</div>
          <div class="qty">
            <button data-dec="${id}" aria-label="Retirer un">${ICON_MINUS}</button>
            <span class="qv">${q}</span>
            <button data-inc="${id}" aria-label="Ajouter un">${ICON_PLUS2}</button>
          </div>
        </div>
        <div class="cart-line-price">${fmt(p.price*q)}</div>
      </div>`;
    }).join('');

    const total = cartTotal(cart);
    area.innerHTML = `
      <div class="cart-list">${rows}</div>
      <div class="cart-summary">
        <div class="sum-row"><span>Sous-total</span><span>${fmt(total)}</span></div>
        <div class="sum-row"><span>Retrait en boutique</span><span>Gratuit</span></div>
        <div class="sum-row total"><span class="l">Total</span><span class="v">${fmt(total)}</span></div>
        <a class="btn-primary" href="Contact.html">Valider la commande
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div style="margin-top:var(--space-4);text-align:center;">
        <a class="text-link" href="Catalogue.html" style="color:var(--color-muted);">+ Ajouter d'autres douceurs</a>
      </div>`;
  }

  area.addEventListener('click', e=>{
    const inc = e.target.closest('[data-inc]');
    const dec = e.target.closest('[data-dec]');
    if(inc){ addToCart(inc.dataset.inc, 1); render(); }
    else if(dec){ addToCart(dec.dataset.dec, -1); render(); }
  });

  render();
</script>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#FAF7F2"/><g transform="translate(50 52)" fill="none" stroke="#7C2D3E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 18h32M-13 18V-4l13-9 13 9v22M-7 18V8a7 7 0 0 1 14 0v10"/><path d="M0-13v-6"/></g></svg>
</template>
</body>
</html>
