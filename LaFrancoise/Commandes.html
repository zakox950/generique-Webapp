<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spyfi Admin — Commandes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body data-page="Commandes">
<img class="bg-photo" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920&q=80" alt="">
<div class="bg-overlay"></div>

<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="topbar-mount"></div>
    <main class="content" data-screen-label="Commandes">
      <div>
        <h1 class="page-title">Commandes Click &amp; Collect</h1>
        <p class="page-sub">Commandes directes payées. Cliquez une ligne pour le détail et les actions.</p>
      </div>

      <div class="page-head-row" style="margin-top:var(--space-6);">
        <div class="segment" id="filterSeg">
          <button class="active" data-f="all">Toutes</button>
          <button data-f="todo">À préparer</button>
          <button data-f="ready">Prêtes</button>
        </div>
        <span class="page-sub" id="count"></span>
      </div>

      <section class="glass-base panel mt">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Client</th><th>Produits</th><th>Retrait</th><th>Paiement</th><th>Statut</th><th class="num">Total</th></tr></thead>
            <tbody id="body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="bottomnav-mount"></div>

<script src="admin.js"></script>
<script>
let filter='all';
const statusOf=o=>o.prete?{cls:'badge-ok',label:'Prête'}:{cls:'badge-warn',label:'À préparer'};
function matches(o){if(filter==='todo')return !o.prete;if(filter==='ready')return o.prete;return true;}
function render(){
  const list=COMMANDES.filter(matches);
  document.getElementById('count').textContent=list.length+' commande'+(list.length>1?'s':'');
  const body=document.getElementById('body');
  if(!list.length){body.innerHTML='<tr><td colspan="7" class="empty-row">Aucune commande dans ce filtre.</td></tr>';return;}
  body.innerHTML=list.map(o=>{const s=statusOf(o);
    return `<tr data-id="${o.id}"><td class="muted">#${o.id}</td><td class="client">${esc(o.nom)}</td><td class="prod">${esc(o.items.map(i=>i.nom).join(', '))}</td><td>${o.dateRetrait.slice(8,10)}/${o.dateRetrait.slice(5,7)} · ${o.heure}</td><td>${o.paiementChoisi==='en_ligne'?'<span class="badge badge-info no-dot">En ligne</span>':'<span class="badge badge-muted no-dot">Sur place</span>'}</td><td><span class="badge ${s.cls}">${s.label}</span></td><td class="num amount">${eur(o.total)}</td></tr>`;
  }).join('');
}
document.getElementById('filterSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#filterSeg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.f;render();});

document.getElementById('body').addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-id]');if(!tr)return;
  const o=COMMANDES.find(x=>x.id==tr.dataset.id);const s=statusOf(o);
  openModal(`
    <div class="modal-head"><div><div class="modal-title">Commande <span class="id">#${o.id}</span></div><div class="modal-sub">Reçue le ${o.dateCommande}</div></div><button class="modal-x" onclick="closeModal()">${ICON_X}</button></div>
    <div class="modal-divider"></div>
    <div class="detail-row"><span class="k">Client</span><span class="v">${esc(o.nom)}</span></div>
    <div class="detail-row"><span class="k">Email</span><span class="v">${esc(o.mail)}</span></div>
    <div class="detail-row"><span class="k">Téléphone</span><span class="v">${o.tel}</span></div>
    <div class="detail-row"><span class="k">Retrait</span><span class="v">${o.dateRetrait.split('-').reverse().join('/')} à ${o.heure}</span></div>
    <div class="detail-row"><span class="k">Paiement</span><span class="v">${o.paiementChoisi==='en_ligne'?'En ligne (payé)':'Sur place'}</span></div>
    <div class="detail-row"><span class="k">Statut</span><span class="v"><span class="badge ${s.cls}">${s.label}</span></span></div>
    ${o.noteClient?`<div class="modal-section-label">Note du client</div><p style="font-size:var(--text-sm);color:var(--color-muted);">${esc(o.noteClient)}</p>`:''}
    <div class="modal-section-label">Articles</div>
    ${o.items.map(i=>`<div class="item-line"><span>${esc(i.nom)}${i.opt?` <span class="q">· ${esc(i.opt)}</span>`:''} <span class="q">×${i.q}</span></span><span class="amount">${eur(i.pu*i.q)}</span></div>`).join('')}
    <div class="detail-row" style="border-top:1px solid var(--color-border);margin-top:8px;padding-top:12px;"><span class="k">Total</span><span class="v amount">${eur(o.total)}</span></div>
    <div class="modal-actions">
      ${o.prete?'':`<button class="btn-primary grow" onclick="markReady(${o.id})">Marquer prête</button>`}
      <button class="btn-ghost${o.prete?' grow':''}" onclick="closeModal();showToast('Email de rappel envoyé à ${esc(o.nom)}')">Envoyer un rappel</button>
      <button class="btn-danger" onclick="deleteOrder(${o.id})">Supprimer</button>
    </div>`);
});
function markReady(id){const o=COMMANDES.find(x=>x.id==id);if(o)o.prete=true;closeModal();render();showToast('Commande #'+id+' marquée prête');}
function deleteOrder(id){const i=COMMANDES.findIndex(x=>x.id==id);if(i>-1)COMMANDES.splice(i,1);closeModal();render();showToast('Commande #'+id+' supprimée');}
render();
</script>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2D3536"/><g transform="translate(50 50)" fill="none" stroke="#98AA9D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M-16 -18h32l-2 36h-28Z"/><path d="M-8 -18a8 8 0 0 1 16 0"/></g></svg>
</template>
</body>
</html>
