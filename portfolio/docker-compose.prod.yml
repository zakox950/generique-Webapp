# ============================================================
# Spyfie — docker-compose production
#
# Déploiement Coolify :
#   - volume nommé spyfie_shots pour persister les captures
#   - port hôte distinct (3101 → 3100) pour cohabiter avec les autres apps
#   - migrations appliquées automatiquement au démarrage (entrypoint.sh)
#   - worker de capture démarré par instrumentation.ts au boot Next.js
#
# Variables obligatoires (définir dans Coolify ou .env.prod) :
#   DATABASE_URL   postgresql://spyfie:<mdp>@db:5432/spyfie
#   ADMIN_PASSWORD mot de passe de la console /admin
#   SESSION_SECRET secret HMAC ≥ 32 caractères aléatoires
# ============================================================

services:
  db:
    image: postgres:16
    container_name: spyfie_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: spyfie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: spyfie
    volumes:
      - spyfie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spyfie -d spyfie"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spyfie_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spyfie:${POSTGRES_PASSWORD}@db:5432/spyfie
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      STORAGE_DIR: /app/data/shots
      PORT: "3100"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      # Captures persistées entre redéploiements
      - spyfie_shots:/app/data/shots
    ports:
      - "3101:3100"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3100/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  spyfie_pgdata:
  spyfie_shots:
