# Postgres dédié au portfolio Spyfie (développement).
# Port hôte distinct (5430) pour ne pas entrer en conflit avec les autres
# projets du repo (patisserie utilise 5120).
services:
  db:
    image: postgres:16
    container_name: spyfie_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spyfie
      POSTGRES_PASSWORD: spyfie_dev
      POSTGRES_DB: spyfie
    ports:
      - "5430:5432"
    volumes:
      - spyfie_pgdata:/var/lib/postgresql/data

volumes:
  spyfie_pgdata:
