<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maison Doree</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
/* ───────────── Maison Dorée — tokens & primitives ───────────── */

:root {
  /* Colors */
  --noir: #0A0A08;
  --noir-surface: #111210;
  --noir-elevated: #1A1C18;
  --or-mat: #C9A96E;
  --or-pale: #E8D5A3;
  --or-dim: #7A6040;
  --blanc-casse: #F0EDE6;
  --cendre: #3A3B38;

  --success: #4A7A55;
  --danger: #8A3A2A;
  --overlay-bg: rgba(0, 0, 0, 0.72);

  /* Spacing — 4px base */
  --space-xs: 4px;
  --space-s: 8px;
  --space-m: 16px;
  --space-l: 24px;
  --space-xl: 40px;
  --space-xxl: 64px;

  /* Type */
  --font-display: 'Playfair Display', 'Freight Display Pro', serif;
  --font-sans: 'DM Sans', -apple-system, system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: #0a0a0a;
  font-family: var(--font-sans);
  color: var(--blanc-casse);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* App root sits inside iOS screen */
.app-root {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--noir);
  overflow: hidden;
  color: var(--blanc-casse);
  font-family: var(--font-sans);
  font-weight: 300;
}

/* ───────────── grain + orb ───────────── */

.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.045;
  z-index: 100;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95 0 0 0 0 0.9 0 0 0 0 0.8 0 0 0 1 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

.orb {
  position: absolute;
  top: -8%;
  right: -22%;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    rgba(201, 169, 110, 0.22) 0%,
    rgba(201, 169, 110, 0.10) 30%,
    rgba(201, 169, 110, 0.04) 55%,
    transparent 72%);
  pointer-events: none;
  z-index: 0;
  animation: orb-pulse 6s ease-in-out infinite;
  filter: blur(6px);
}

@keyframes orb-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.08); opacity: 0.82; }
}

/* ───────────── scrollbar ───────────── */

.scroll::-webkit-scrollbar { width: 0; display: none; }
.scroll { scrollbar-width: none; -ms-overflow-style: none; }

/* ───────────── utility text ───────────── */

.eyebrow {
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--or-dim);
}

.micro {
  font-family: var(--font-sans);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.hairline {
  width: 40px;
  height: 1px;
  background: rgba(201, 169, 110, 0.25);
  border: none;
  margin: 0 auto;
}

/* ───────────── hero ───────────── */

.hero {
  position: relative;
  min-height: 100%;
  padding: 108px var(--space-l) 0;
  display: flex;
  flex-direction: column;
  z-index: 1;
}

.hero-title {
  font-family: var(--font-display);
  font-size: 58px;
  font-weight: 300;
  line-height: 0.92;
  color: var(--blanc-casse);
  letter-spacing: -0.01em;
  margin-top: var(--space-l);
}

.hero-title .accent {
  font-style: italic;
  font-weight: 400;
  color: var(--or-mat);
  display: block;
}

.hero-sub {
  margin-top: var(--space-l);
  font-size: 13px;
  line-height: 1.7;
  color: rgba(240, 237, 230, 0.48);
  max-width: 260px;
  font-weight: 300;
}

.cta-pill {
  margin-top: var(--space-xl);
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  height: 52px;
  padding: 0 24px;
  border-radius: 100px;
  background: var(--or-mat);
  color: var(--noir);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: transform 120ms ease;
}
.cta-pill:active { transform: scale(0.96); }

.cta-ghost {
  background: transparent;
  color: var(--or-mat);
  border: 1px solid rgba(201, 169, 110, 0.4);
}

.scroll-indicator {
  position: absolute;
  right: var(--space-l);
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 2;
}

.scroll-indicator .line {
  width: 1px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, rgba(201, 169, 110, 0.4), transparent);
  animation: scroll-pulse 2s ease-in-out infinite;
  transform-origin: center;
}

@keyframes scroll-pulse {
  0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
  50% { transform: scaleY(1); opacity: 1; }
}

.scroll-indicator .label {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 9px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(201, 169, 110, 0.5);
}

/* ───────────── selection strip ───────────── */

.strip {
  margin-top: var(--space-xl);
  padding-bottom: var(--space-xl);
}
.strip-head {
  padding: 0 var(--space-l);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.strip-head h2 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 28px;
  margin: 0;
  line-height: 1;
}
.strip-rail {
  display: flex;
  gap: 12px;
  padding: var(--space-m) var(--space-l) var(--space-s);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
}
.strip-card {
  flex: 0 0 240px;
  scroll-snap-align: start;
  border-radius: 14px;
  overflow: hidden;
  background: var(--noir-surface);
  border: 1px solid rgba(201, 169, 110, 0.08);
  position: relative;
  cursor: pointer;
  transition: transform 180ms ease;
}
.strip-card:active { transform: scale(0.97); }
.strip-card .media {
  aspect-ratio: 3 / 4;
  width: 100%;
  position: relative;
}
.strip-card .info {
  padding: 12px 14px 16px;
}
.strip-card .info h3 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 18px;
  margin: 0;
  line-height: 1.2;
}
.strip-card .info .price {
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--or-mat);
  margin-top: 4px;
}

/* ───────────── values 2x2 ───────────── */

.values {
  padding: var(--space-xxl) var(--space-l) var(--space-xxl);
  position: relative;
}
.values-head {
  text-align: center;
  margin-bottom: var(--space-xl);
}
.values-head h2 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 32px;
  line-height: 1.1;
  margin: 8px 0 0;
}
.values-head h2 em { color: var(--or-mat); font-weight: 400; }
.values-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: var(--space-l);
}
.value-card {
  background: var(--noir-surface);
  border: 1px solid rgba(201, 169, 110, 0.1);
  border-radius: 14px;
  padding: 20px 16px 22px;
  min-height: 132px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.value-card .num {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 300;
  color: var(--or-mat);
  line-height: 1;
  font-style: italic;
}
.value-card h3 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 17px;
  margin: 0 0 6px;
}
.value-card p {
  font-size: 11px;
  line-height: 1.6;
  color: rgba(240, 237, 230, 0.55);
  margin: 0;
}

/* ───────────── bottom nav ───────────── */

.bottom-nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 22px;
  width: calc(100% - 40px);
  max-width: 420px;
  height: 56px;
  padding: 0 8px;
  border-radius: 100px;
  background: rgba(10, 10, 8, 0.82);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 60;
  transition: height 360ms cubic-bezier(0.32, 0.72, 0, 1),
              width 360ms cubic-bezier(0.32, 0.72, 0, 1),
              bottom 360ms cubic-bezier(0.32, 0.72, 0, 1);
}

.bottom-nav.collapsed {
  height: 44px;
  width: 180px;
}
.bottom-nav.collapsed .nav-item .nav-label { opacity: 0; transform: translateY(4px); }
.bottom-nav.collapsed .nav-item { padding: 0 10px; }
.bottom-nav.collapsed .nav-item .nav-dot { bottom: 4px; }

.nav-item {
  flex: 1;
  height: 100%;
  padding: 0 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: rgba(240, 237, 230, 0.3);
  cursor: pointer;
  position: relative;
  transition: color 180ms ease;
}
.nav-item.active { color: var(--or-mat); }
.nav-label {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  transition: opacity 220ms ease, transform 220ms ease;
}
.nav-dot {
  position: absolute;
  bottom: 6px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--or-mat);
  opacity: 0;
  transition: opacity 180ms ease;
}
.nav-item.active .nav-dot { opacity: 1; }

/* ───────────── cart badge ───────────── */

.nav-badge {
  position: absolute;
  top: 6px;
  right: calc(50% - 16px);
  min-width: 14px;
  height: 14px;
  padding: 0 4px;
  border-radius: 7px;
  background: var(--or-mat);
  color: var(--noir);
  font-size: 9px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ───────────── catalogue ───────────── */

.cat-head {
  padding: 56px var(--space-l) 0;
  position: sticky;
  top: 0;
  background: linear-gradient(to bottom, var(--noir) 75%, rgba(10, 10, 8, 0.0));
  z-index: 20;
  padding-bottom: 14px;
}
.cat-head h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 38px;
  margin: 8px 0 0;
  line-height: 1;
  letter-spacing: -0.01em;
}
.cat-head h1 em {
  color: var(--or-mat);
  font-weight: 400;
}

.filter-rail {
  display: flex;
  gap: 8px;
  margin-top: 18px;
  overflow-x: auto;
  padding-bottom: 2px;
}
.filter-pill {
  flex-shrink: 0;
  height: 32px;
  padding: 0 14px;
  border-radius: 100px;
  background: transparent;
  border: 1px solid rgba(201, 169, 110, 0.18);
  color: rgba(240, 237, 230, 0.55);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 180ms ease;
  white-space: nowrap;
}
.filter-pill.active {
  background: var(--or-mat);
  color: var(--noir);
  border-color: var(--or-mat);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px;
  padding-bottom: 140px;
}
.grid.three { grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px; padding-bottom: 140px; }

.product-card {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: var(--noir-surface);
  border: 1px solid rgba(201, 169, 110, 0.08);
  cursor: pointer;
  transition: transform 180ms ease;
  display: flex;
  flex-direction: column;
}
.product-card:active { transform: scale(0.97); }
.product-card.wide { grid-column: span 2; }
.product-card.tall .media { aspect-ratio: 3 / 4; }
.product-card.wide .media { aspect-ratio: 16 / 9; }
.product-card.normal .media { aspect-ratio: 4 / 3; }
.grid.three .product-card.wide { grid-column: span 2; }
.grid.three .product-card .media { aspect-ratio: 4 / 5; }

.media {
  position: relative;
  width: 100%;
  overflow: hidden;
}

.media::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.0) 55%);
  pointer-events: none;
}

.card-overlay {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 10px;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 8px;
}
.card-overlay .name {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 18px;
  line-height: 1.15;
  color: var(--blanc-casse);
  letter-spacing: -0.01em;
}
.card-overlay .price {
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--or-mat);
  white-space: nowrap;
}
.grid.three .card-overlay .name { font-size: 13px; }
.grid.three .card-overlay .price { font-size: 12px; }

.product-card.wide .card-overlay .name { font-size: 26px; }
.product-card.wide .card-overlay .price { font-size: 22px; }

.tag {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 3;
  padding: 4px 10px;
  border-radius: 100px;
  background: rgba(201, 169, 110, 0.15);
  border: 1px solid rgba(201, 169, 110, 0.35);
  color: var(--or-mat);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  backdrop-filter: blur(6px);
}

/* ───────────── bottom sheet ───────────── */

.sheet-backdrop {
  position: absolute;
  inset: 0;
  background: var(--overlay-bg);
  backdrop-filter: blur(2px);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 280ms ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 210;
  background: rgba(17, 18, 16, 0.92);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border-top: 1px solid rgba(201, 169, 110, 0.18);
  border-radius: 28px 28px 0 0;
  transform: translateY(100%);
  transition: transform 340ms cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 88%;
  overflow: auto;
  padding-bottom: 40px;
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--cendre);
  margin: 10px auto 0;
}
.sheet-image {
  height: 240px;
  margin: 16px 16px 20px;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  background: var(--noir-surface);
}
.sheet-body { padding: 0 24px; }
.sheet-cat {
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--or-dim);
}
.sheet-name {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 30px;
  line-height: 1.1;
  margin: 6px 0 12px;
}
.sheet-desc {
  font-size: 13px;
  line-height: 1.75;
  color: rgba(240, 237, 230, 0.62);
  font-weight: 300;
  margin-bottom: 20px;
}
.sheet-ingredients {
  margin-bottom: 24px;
  padding: 16px 0;
  border-top: 1px solid rgba(201, 169, 110, 0.15);
  border-bottom: 1px solid rgba(201, 169, 110, 0.15);
  display: flex;
  justify-content: space-between;
  gap: 18px;
}
.sheet-ingredients > div { flex: 1; }
.sheet-ingredients .k {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--or-dim);
  margin-bottom: 6px;
}
.sheet-ingredients .v {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--blanc-casse);
  font-weight: 300;
}
.sheet-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding-top: 10px;
}
.sheet-price {
  font-family: var(--font-display);
  font-size: 28px;
  color: var(--or-mat);
  font-weight: 400;
}
.qty {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 6px;
  height: 40px;
  border-radius: 100px;
  background: rgba(201, 169, 110, 0.12);
  border: 1px solid rgba(201, 169, 110, 0.25);
}
.qty button {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: none;
  border: none;
  color: var(--or-mat);
  font-size: 16px;
  cursor: pointer;
  font-family: var(--font-sans);
  font-weight: 400;
}
.qty span {
  font-family: var(--font-display);
  color: var(--blanc-casse);
  font-size: 15px;
  min-width: 12px;
  text-align: center;
}
.sheet-cta {
  margin: 24px 24px 0;
  display: block;
  width: calc(100% - 48px);
  height: 52px;
  border-radius: 12px;
  background: var(--or-mat);
  color: var(--noir);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: transform 120ms ease;
}
.sheet-cta:active { transform: scale(0.98); }

/* ───────────── cart ───────────── */

.screen-head {
  padding: 60px var(--space-l) 10px;
}
.screen-head .eyebrow { margin-bottom: 10px; }
.screen-head h1 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 42px;
  margin: 0;
  line-height: 1;
  letter-spacing: -0.01em;
}
.screen-head h1 em { color: var(--or-mat); font-weight: 400; }

.cart-list {
  padding: var(--space-l) var(--space-l) 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-bottom: 240px;
}
.cart-item {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 14px;
  background: var(--noir-surface);
  border: 1px solid rgba(201, 169, 110, 0.08);
  border-radius: 14px;
}
.cart-item .thumb {
  width: 76px;
  height: 76px;
  border-radius: 10px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.cart-item .info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cart-item .info .cat {
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--or-dim);
  text-transform: uppercase;
}
.cart-item .info h4 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 400;
  margin: 0;
  line-height: 1.15;
}
.cart-item .info .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
}
.cart-item .info .price {
  font-family: var(--font-display);
  font-size: 17px;
  color: var(--or-mat);
}
.qty.small { height: 30px; padding: 0 4px; }
.qty.small button { width: 22px; height: 22px; font-size: 13px; }
.qty.small span { font-size: 13px; }

.cart-footer {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 90px;
  background: rgba(17, 18, 16, 0.92);
  backdrop-filter: blur(32px) saturate(180%);
  -webkit-backdrop-filter: blur(32px) saturate(180%);
  border: 1px solid rgba(201, 169, 110, 0.18);
  border-radius: 20px;
  padding: 16px 18px 18px;
  z-index: 40;
}
.cart-footer .line {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.cart-footer .k {
  font-size: 10px;
  letter-spacing: 0.22em;
  color: var(--or-dim);
  text-transform: uppercase;
}
.cart-footer .v {
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--or-mat);
}
.cart-footer .pickup {
  font-size: 10px;
  color: rgba(240, 237, 230, 0.5);
  margin: 4px 0 14px;
}
.cart-footer .submit {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 48px;
  border-radius: 12px;
  background: var(--or-mat);
  color: var(--noir);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  gap: 12px;
}
.cart-empty {
  padding: 120px 40px;
  text-align: center;
  color: rgba(240, 237, 230, 0.4);
}
.cart-empty h3 {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 300;
  color: var(--blanc-casse);
  margin: 16px 0 8px;
}
.cart-empty p {
  font-size: 13px;
  line-height: 1.7;
  font-weight: 300;
}

/* ───────────── checkout form + contact ───────────── */

.form-wrap {
  padding: 0 var(--space-l);
  padding-bottom: 140px;
}
.field {
  margin-top: 16px;
}
.field label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--or-dim);
  margin-bottom: 8px;
}
.field input,
.field textarea,
.field select {
  width: 100%;
  background: rgba(26, 28, 24, 0.8);
  border: 1px solid rgba(201, 169, 110, 0.18);
  border-radius: 12px;
  padding: 13px 16px;
  color: var(--blanc-casse);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 300;
  outline: none;
  transition: border 180ms ease, box-shadow 180ms ease;
}
.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--or-mat);
  box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.10);
}
.field textarea {
  min-height: 100px;
  resize: none;
}
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.slot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}
.slot {
  padding: 10px 8px;
  border-radius: 12px;
  background: rgba(26, 28, 24, 0.8);
  border: 1px solid rgba(201, 169, 110, 0.14);
  text-align: center;
  cursor: pointer;
  transition: all 180ms ease;
}
.slot.active {
  background: rgba(201, 169, 110, 0.12);
  border-color: var(--or-mat);
}
.slot .day {
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--or-dim);
  text-transform: uppercase;
}
.slot.active .day { color: var(--or-mat); }
.slot .time {
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--blanc-casse);
  margin-top: 4px;
}

.submit-btn {
  margin-top: 28px;
  display: block;
  width: 100%;
  height: 52px;
  border-radius: 12px;
  background: var(--or-mat);
  color: var(--noir);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
}

.segmented {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: rgba(26, 28, 24, 0.5);
  border: 1px solid rgba(201, 169, 110, 0.14);
  border-radius: 100px;
  margin: 0 var(--space-l);
  margin-top: 18px;
}
.segmented button {
  flex: 1;
  height: 38px;
  border-radius: 100px;
  background: transparent;
  border: none;
  color: rgba(240, 237, 230, 0.5);
  font-family: var(--font-sans);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 200ms ease;
}
.segmented button.active {
  background: var(--or-mat);
  color: var(--noir);
}

/* ───────────── toast ───────────── */

.toast {
  position: absolute;
  left: 50%;
  transform: translate(-50%, 20px);
  bottom: 96px;
  background: rgba(10, 10, 8, 0.88);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(201, 169, 110, 0.28);
  border-radius: 100px;
  padding: 12px 20px 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--blanc-casse);
  opacity: 0;
  pointer-events: none;
  z-index: 300;
  transition: opacity 250ms ease, transform 250ms cubic-bezier(0.32,0.72,0,1);
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}
.toast .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--or-mat);
}

/* ───────────── tweaks panel ───────────── */

.tweaks-panel {
  position: fixed;
  right: 16px;
  bottom: 16px;
  width: 280px;
  max-height: 80vh;
  overflow: auto;
  background: rgba(17, 18, 16, 0.95);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(201, 169, 110, 0.3);
  border-radius: 18px;
  padding: 18px;
  z-index: 9999;
  color: var(--blanc-casse);
  font-family: var(--font-sans);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.tweaks-panel h4 {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: 18px;
  margin: 0 0 14px;
  color: var(--or-mat);
}
.tweaks-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid rgba(201, 169, 110, 0.1);
  gap: 12px;
}
.tweaks-row:first-of-type { border-top: none; }
.tweaks-row .k {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(240, 237, 230, 0.7);
}
.tweaks-row input[type="text"] {
  background: rgba(26,28,24,0.8);
  border: 1px solid rgba(201,169,110,0.2);
  border-radius: 8px;
  padding: 6px 10px;
  color: var(--blanc-casse);
  font-size: 12px;
  width: 150px;
}
.toggle {
  width: 40px;
  height: 22px;
  border-radius: 12px;
  background: rgba(58, 59, 56, 0.6);
  position: relative;
  cursor: pointer;
  transition: background 200ms ease;
  border: none;
  flex-shrink: 0;
}
.toggle.on { background: var(--or-mat); }
.toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: left 200ms ease;
}
.toggle.on::after { left: 20px; }
.hue-row {
  display: flex;
  gap: 6px;
}
.hue-swatch {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
}
.hue-swatch.active { border-color: #fff; }

/* ───────────── placeholder media (striped monospace) ───────────── */

.ph {
  position: absolute;
  inset: 0;
  background: var(--bg, #2a2823);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ph::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    45deg,
    rgba(201,169,110,0.06) 0 2px,
    transparent 2px 12px
  );
}
.ph .ph-label {
  position: relative;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 9px;
  letter-spacing: 0.2em;
  color: rgba(240, 237, 230, 0.28);
  text-transform: uppercase;
  padding: 4px 10px;
  border: 1px solid rgba(240, 237, 230, 0.12);
  border-radius: 2px;
}

/* ───────────── solid color cards (imagery mix) ───────────── */

.ph-solid {
  position: absolute;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
}
.ph-solid::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 35% 30%, rgba(201,169,110,0.12) 0%, transparent 55%);
}
.ph-solid .mono {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 44px;
  font-weight: 300;
  color: rgba(201, 169, 110, 0.25);
  letter-spacing: -0.02em;
}

/* ───────────── page transitions ───────────── */

.page {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
  transition: opacity 220ms ease, transform 220ms ease;
}
.page.active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
  z-index: 2;
}

body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at center, #1a1712 0%, #050503 70%); padding: 24px; margin: 0; }
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.caption { font-family: 'DM Sans', sans-serif; font-size: 11px; color: rgba(240,237,230,0.35); letter-spacing: 0.2em; text-transform: uppercase; }
#err { position:fixed; top:0; left:0; right:0; color:#fff; background:#a00; padding:8px; font:11px monospace; white-space:pre-wrap; z-index:99999; display:none; max-height:60vh; overflow:auto; }
