/* ── Bottom Nav Pill ── */
function BottomNav({ items, current, onNavigate, dark = true }) {
  const [collapsed, setCollapsed] = useStateM(false);
  const [vvOffset, setVvOffset] = useStateM(0);
  const lastY = useRefM(0);
  const navRef = useRefM(null);
  const collapsedRef = useRefM(false);

  // keep ref in sync — avoids stale closure inside the scroll listener
  useEffectM(() => { collapsedRef.current = collapsed; }, [collapsed]);

  // scroll listener — re-attach on every page change because .mobile-scroll
  // remounts with each MobilePage (different React component, different DOM node)
  useEffectM(() => {
    // wait one frame so the new page's .mobile-scroll is in the DOM
    let scroller = null;
    let raf = requestAnimationFrame(() => {
      scroller = document.querySelector(".mobile-scroll");
      if (!scroller) return;
      lastY.current = scroller.scrollTop;

      function onScroll() {
        const y = scroller.scrollTop;
        const delta = y - lastY.current;
        if (delta > 8 && !collapsedRef.current && y > 60) {
          collapsedRef.current = true; setCollapsed(true);
        } else if (delta < -6 && collapsedRef.current) {
          collapsedRef.current = false; setCollapsed(false);
        }
        if (y < 20 && collapsedRef.current) {
          collapsedRef.current = false; setCollapsed(false);
        }
        lastY.current = y;
      }
      scroller.addEventListener("scroll", onScroll, { passive: true });
      scroller.__onScroll = onScroll;
    });
    return () => {
      cancelAnimationFrame(raf);
      if (scroller && scroller.__onScroll) scroller.removeEventListener("scroll", scroller.__onScroll);
    };
  }, [current]);

  // reset on route change
  useEffectM(() => {
    collapsedRef.current = false;
    setCollapsed(false);
    const s = document.querySelector(".mobile-scroll");
    if (s) s.scrollTop = 0;
    lastY.current = 0;
  }, [current]);

  // Repositionne la nav quand la barre du navigateur apparaît/disparaît
  useEffectM(() => {
    const vv = window.visualViewport;
    if (!vv) return;
    function update() {
      const gap = window.innerHeight - vv.offsetTop - vv.height;
      setVvOffset(Math.max(0, gap));
    }
    vv.addEventListener('resize', update);
    vv.addEventListener('scroll', update);
    update();
    return () => {
      vv.removeEventListener('resize', update);
      vv.removeEventListener('scroll', update);
    };
  }, []);

  const handleClick = () => { if (collapsed) setCollapsed(false); };

  const palette = dark ? {
    bg: "rgba(56,22,27,0.42)",
    border: "rgba(255,255,255,0.14)",
    rim: "rgba(255,255,255,0.20)",
    rim2: "rgba(255,255,255,0.06)",
    line: "rgba(255,255,255,0.34)",
    dotIdle: "rgba(255,255,255,0.36)",
    iconIdle: "rgba(245,240,232,0.45)",
    accent: "var(--c-signature)",
  } : {
    bg: "rgba(255,255,255,0.62)",
    border: "rgba(255,255,255,0.85)",
    rim: "rgba(255,255,255,0.95)",
    rim2: "rgba(0,0,0,0.04)",
    line: "rgba(18,43,24,0.18)",
    dotIdle: "rgba(18,43,24,0.30)",
    iconIdle: "rgba(46,92,56,0.55)",
    accent: "var(--a-accent)",
  };

  return (
    <nav ref={navRef} onClick={handleClick} className={`mobile-bottom-nav ${collapsed ? "collapsed" : ""} ${dark ? "" : "light"}`}
      style={{
        position: "absolute",
        bottom: `calc(env(safe-area-inset-bottom, 0px) + ${14 + vvOffset}px)`,
        left: "50%", transform: "translateX(-50%)",
        zIndex: 100,
        width: collapsed ? 86 : "calc(100% - 32px)",
        maxWidth: 400, height: collapsed ? 38 : 60,
        borderRadius: 999, overflow: "hidden",
        background: palette.bg,
        backdropFilter: "blur(22px) saturate(170%)" + (dark ? " brightness(0.92)" : " brightness(1.05)"),
        WebkitBackdropFilter: "blur(22px) saturate(170%)" + (dark ? " brightness(0.92)" : " brightness(1.05)"),
        border: `1px solid ${palette.border}`,
        boxShadow: dark
          ? `0 14px 44px rgba(0,0,0,0.36), 0 2px 10px rgba(0,0,0,0.22), inset 0 1px 0 ${palette.rim}, inset 0 -1px 0 ${palette.rim2}`
          : `0 10px 36px rgba(30,42,74,0.18), 0 2px 8px rgba(30,42,74,0.10), inset 0 1px 0 ${palette.rim}, inset 0 -1px 0 ${palette.rim2}`,
        transition: "all 0.36s cubic-bezier(0.32,0.72,0,1), opacity 0.28s",
        opacity: collapsed ? 0.85 : 1,
        cursor: collapsed ? "pointer" : "default",
      }}>
      {/* Rim highlight line */}
      <div style={{
        position: "absolute", top: 0, left: "15%", right: "15%", height: 1,
        background: `linear-gradient(90deg, transparent, ${palette.line} 40%, ${palette.line} 60%, transparent)`,
        pointerEvents: "none",
      }}/>

      {/* Dots (collapsed) */}
      <div style={{
        position: "absolute", inset: 0,
        display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
        opacity: collapsed ? 1 : 0, transition: "opacity 0.22s", pointerEvents: "none",
      }}>
        {items.map(it => {
          const active = current === it.id;
          return <div key={it.id} style={{
            width: active ? 6 : 4, height: active ? 6 : 4, borderRadius: 999,
            background: active ? palette.accent : palette.dotIdle,
            transition: "all 0.2s ease",
          }}/>;
        })}
      </div>

      {/* Items */}
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-around",
        height: "100%", padding: "0 6px",
        opacity: collapsed ? 0 : 1, pointerEvents: collapsed ? "none" : "auto",
        transition: "opacity 0.22s",
      }}>
        {items.map(it => {
          const active = current === it.id;
          return (
            <button key={it.id} onClick={(e) => { e.stopPropagation(); onNavigate(it.id); }}
              style={{
                background: "transparent", border: 0,
                color: active ? palette.accent : palette.iconIdle,
                padding: "6px 10px", cursor: "pointer",
                display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
                fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", fontWeight: 600,
                transition: "color 0.18s, transform 0.12s",
                fontFamily: "var(--sans)",
              }}>
              <div style={{ position: "relative" }}>
                {it.icon}
                {it.badge > 0 && (
                  <span style={{
                    position: "absolute", top: -4, right: -8,
                    background: palette.accent, color: dark ? "#1a1614" : "#fff",
                    fontSize: 9, fontWeight: 700, minWidth: 15, height: 15, padding: "0 4px", borderRadius: 999,
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>{it.badge}</span>
                )}
              </div>
              <span>{it.label}</span>
            </button>
          );
        })}
      </div>
    </nav>
  );
}

function MProductModal({ product, onClose, addToCart }) {
  const optCats = Object.keys(product.options);
  const [sel, setSel] = useStateMC(() => {
    const i = {};
    optCats.forEach(c => { i[c] = Object.keys(product.options[c])[0]; });
    return i;
  });
  const [qty, setQty] = useStateMC(1);
  const surcharge = optCats.reduce((s, c) => s + (product.options[c][sel[c]] || 0), 0);
  const unit = product.price + surcharge;
  const total = unit * qty;

  function add() {
    const lbl = optCats.map(c => sel[c]).join(" · ");
    addToCart({
      id: product.id + (lbl ? `|${lbl}` : ""),
      productId: product.id, name: product.name, photo: product.photo,
      opt: lbl, qty, price: unit,
    });
    onClose();
  }

  // Hide bottom nav while sheet is open
  useEffectMC(() => {
    document.body.classList.add("sheet-open");
    return () => document.body.classList.remove("sheet-open");
  }, []);

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, zIndex: 200,
      background: "rgba(56,22,27,0.55)", backdropFilter: "blur(18px)",
      WebkitBackdropFilter: "blur(18px)",

        borderRadius: "26px 26px 0 0", borderBottom: 0,
        animation: "slideUp 0.36s cubic-bezier(0.32,0.72,0,1)",
      }}>
        <style>{`@keyframes slideUp { from { transform: translateY(40px); opacity: 0;} to { transform: translateY(0); opacity: 1;} }`}</style>
        <div style={{
          height: 280, backgroundImage: `url(${product.photo})`, backgroundSize: "cover", backgroundPosition: "center",
          borderRadius: "26px 26px 0 0", position: "relative",
        }}>
          <button onClick={onClose} style={{
            position: "absolute", top: 14, right: 14,

        <div style={{ padding: "24px 22px 28px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>

            <div key={cat} style={{ marginBottom: 18 }}>

              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>

function StatCardSm({ label, value, tone, trend, trendUp }) {

        </div>

function MGradientBarChart({ data }) {
  const w = 360, h = 108, padL = 6, padR = 6, padT = 6, padB = 20;
  const max = Math.max(...data.map(d => d.value)) * 1.1 || 100;
  const bw = (w - padL - padR) / data.length;
  const gap = bw * 0.3;
  const barW = bw - gap;
  const hiVal = Math.max(...data.map(d => d.value));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: h }}>
      <defs>
        <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#a8e6b8" stopOpacity="0.38"/>
          <stop offset="100%" stopColor="#a8e6b8" stopOpacity="0.1"/>
        </linearGradient>
        <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#5ec99a" stopOpacity="0.95"/>
          <stop offset="100%" stopColor="#2d9a5a" stopOpacity="0.55"/>
        </linearGradient>
      </defs>
      {[0.25, 0.6, 1].map((p, i) => (
        <line key={i} x1={padL} x2={w - padR}
          y1={padT + p * (h - padT - padB)} y2={padT + p * (h - padT - padB)}
          stroke="rgba(232,245,236,0.14)" strokeDasharray="3 5"/>
      ))}
      {data.map((d, i) => {
        const bh = Math.max(4, (d.value / max) * (h - padT - padB));
        const x = padL + i * bw + gap / 2;
        const y = h - padB - bh;
        const isHi = d.value === hiVal;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={bh}
              rx={Math.min(5, barW * 0.28)}
              fill={isHi ? "url(#bg2)" : "url(#bg1)"}/>
            <text x={x + barW / 2} y={h - 5} textAnchor="middle"
              fontSize="9" fontFamily="Manrope, sans-serif"
              fill={isHi ? "rgba(232,245,236,0.9)" : "rgba(232,245,236,0.45)"}
              fontWeight={isHi ? "700" : "400"}>{d.day}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* ── CATALOGUE ── */
function MAdminCatalogue({ navigate, products, setProducts }) {
  const [editP, setEditP] = useStateMA(null);
  const [newOpen, setNewOpen] = useStateMA(false);

  function toggleActive(id) { setProducts(products.map(p => p.id === id ? { ...p, active: !p.active } : p)); }
  function saveEdit(updated) { setProducts(products.map(p => p.id === updated.id ? updated : p)); setEditP(null); }
  function createProduct(prod) { setProducts([...products, prod]); setNewOpen(false); }
  function deleteProduct(id) { setProducts(products.filter(p => p.id !== id)); setEditP(null); }

  return (
    <MobilePage>
      <MobileTopbarLight sub={products.length + " produits"} title="Catalogue" right={
        <button onClick={() => setNewOpen(true)} className="neu-out-sm" style={{
          background: "var(--a-accent)", color: "#fff", border: 0, padding: "9px 13px", borderRadius: 10,
          fontSize: 11.5, fontWeight: 600, display: "flex", alignItems: "center", gap: 6,
        }}><I.plus size={12} stroke={2.5}/> Nouveau</button>
      }/>
      <div style={{ padding: "0 18px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          {products.map(p => (
            <div key={p.id} onClick={() => setEditP(p)} className="a-card" style={{
              borderRadius: 14, overflow: "hidden", cursor: "pointer",
              opacity: p.active ? 1 : 0.55,
              filter: p.active ? "none" : "grayscale(0.4)",
              transition: "opacity 0.2s ease",
            }}>
              <div style={{ height: 100, backgroundImage: "url(" + p.photo + ")", backgroundSize: "cover", backgroundPosition: "center", position: "relative" }}>
                {p.badge && <div style={{ position: "absolute", top: 6, left: 6 }}><span className="badge" style={{ background: "var(--c-signature)", color: "#fff", fontSize: 9, padding: "2px 6px" }}>{p.badge}</span></div>}
                {p.promo && <div style={{ position: "absolute", top: 6, right: 6 }}><span className="badge" style={{ background: "#c9954f", color: "#fff", fontSize: 9, padding: "2px 6px" }}>-{p.promo.value}{p.promo.type === "pourcentage" ? "%" : "€"}</span></div>}
              </div>
              <div style={{ padding: "10px 12px 12px" }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--a-ink)", lineHeight: 1.2, marginBottom: 2 }}>{p.name}</div>
                <div style={{ fontSize: 11.5, color: "var(--a-accent)", fontWeight: 700, marginBottom: 8 }}>{p.price.toFixed(2).replace(".", ",")} €</div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div onClick={e => e.stopPropagation()}><NeuSwitch value={p.active} onChange={() => toggleActive(p.id)}/></div>
                  <span style={{ fontSize: 9.5, color: p.active ? "#1f8a5b" : "var(--a-ink-3)", fontWeight: 600, letterSpacing: "0.04em" }}>{p.active ? "ACTIF" : "INACTIF"}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {editP && <MProductEditSheet product={editP} onClose={() => setEditP(null)} onSave={saveEdit} onDelete={deleteProduct}/>}
      {newOpen && <MProductEditSheet
        product={{ id: "p-new-" + Date.now(), name: "", short: "", price: 0, mode: "make_to_stock", photo: "", active: true, stock: 0, options: {} }}
        onClose={() => setNewOpen(false)} onSave={createProduct} isNew={true}
      />}
    </MobilePage>
  );
}

function MProductEditSheet({ product, onClose, onSave, onDelete, isNew = false }) {
  const [p, setP] = useStateMA({ ...product });
  const [tab, setTab] = useStateMA("info");
  const upd = (k, v) => setP(prev => ({ ...prev, [k]: v }));
  const updPromo = (k, v) => setP(prev => ({ ...prev, promo: { ...(prev.promo || { type: "pourcentage", value: 0 }), [k]: v } }));

  React.useEffect(() => {
    document.body.classList.add("sheet-open");
    return () => document.body.classList.remove("sheet-open");
  }, []);

  const tabList = [["info","Infos"],["promo","Promo"],["acompte","Acompte"]];

  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(74,31,36,0.3)", backdropFilter: "blur(4px)", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div onClick={e => e.stopPropagation()} className="admin-shell" style={{ width: "min(100vw, 430px)", maxHeight: "92vh", overflow: "auto", borderRadius: "24px 24px 0 0", padding: "20px 22px 32px", animation: "slideUp 0.36s cubic-bezier(0.32,0.72,0,1)" }}>
        <div style={{ width: 38, height: 4, background: "var(--a-lo)", borderRadius: 999, margin: "0 auto 16px" }}/>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: "var(--a-ink)" }}>{isNew ? "Nouveau produit" : (p.name || "Produit")}</div>
          <button onClick={onClose} className="neu-out-sm" style={{ width: 32, height: 32, borderRadius: 9, border: 0, background: "var(--a-bg)", color: "var(--a-ink-2)" }}><I.close size={14}/></button>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 18, overflowX: "auto", scrollbarWidth: "none" }}>
          {tabList.map(([id, l]) => (
            <button key={id} onClick={() => setTab(id)} className={tab === id ? "neu-in-sm" : "neu-out-sm"} style={{
              background: "var(--a-bg)", border: 0, padding: "7px 13px", borderRadius: 9,
              fontSize: 11.5, fontWeight: tab === id ? 700 : 500,
              color: tab === id ? "var(--a-accent)" : "var(--a-ink-3)", whiteSpace: "nowrap",
            }}>{l}</button>
          ))}
        </div>

        {tab === "info" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Nom</label><input value={p.name} onChange={e => upd("name", e.target.value)}/></div>
            <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Description courte</label><textarea value={p.short || ""} onChange={e => upd("short", e.target.value)} style={{ minHeight: 60, resize: "vertical" }}/></div>
            <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Prix unitaire (€)</label><input type="number" step="0.5" min="0" value={p.price} onChange={e => upd("price", Number(e.target.value))}/></div>
            <div>
              <label className="fld-lbl" style={{ display: "block", marginBottom: 8 }}>Mode de production</label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
                {[["make_to_stock","Boutique"],["make_to_order","Sur cmd."]].map(([v,l]) => (
                  <button key={v} onClick={() => upd("mode", v)} className={p.mode === v ? "neu-in-sm" : "neu-out-sm"} style={{ background: "var(--a-bg)", border: 0, padding: "9px", borderRadius: 9, fontSize: 12, fontWeight: p.mode === v ? 700 : 500, color: p.mode === v ? "var(--a-accent)" : "var(--a-ink-2)" }}>{l}</button>
                ))}
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderTop: "1px solid rgba(196,201,212,0.35)" }}>
              <span style={{ fontSize: 13, color: "var(--a-ink)", fontWeight: 600 }}>Produit actif</span>
              <NeuSwitch value={p.active} onChange={() => upd("active", !p.active)}/>
            </div>
          </div>
        )}

        {tab === "promo" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div>
              <label className="fld-lbl" style={{ display: "block", marginBottom: 8 }}>Type de promotion</label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
                {[["none","Aucune"],["pourcentage","%"],["montant_fixe","€"]].map(([v,l]) => {
                  const active = (v === "none" && !p.promo) || (p.promo && p.promo.type === v);
                  return (
                    <button key={v} onClick={() => upd("promo", v === "none" ? null : { ...(p.promo || {}), type: v, value: p.promo?.value || 0 })} className={active ? "neu-in-sm" : "neu-out-sm"} style={{ background: "var(--a-bg)", border: 0, padding: "9px", borderRadius: 9, fontSize: 12, fontWeight: active ? 700 : 500, color: active ? "var(--a-accent)" : "var(--a-ink-2)" }}>{l}</button>
                  );
                })}
              </div>
            </div>
            {p.promo && (
              <>
                <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Valeur {p.promo.type === "pourcentage" ? "(%)" : "(€)"}</label><input type="number" min="0" value={p.promo.value || ""} onChange={e => updPromo("value", Number(e.target.value))}/></div>
                <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Date de début</label><input type="date" value={p.promo.dateDebut || ""} onChange={e => updPromo("dateDebut", e.target.value)}/></div>
                <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Date de fin</label><input type="date" value={p.promo.dateFin || ""} onChange={e => updPromo("dateFin", e.target.value)}/></div>
                {p.promo.value > 0 && (
                  <div className="neu-flat" style={{ padding: 12, borderRadius: 10, fontSize: 12, color: "var(--a-ink-2)" }}>
                    Prix affiché : <strong>{p.promo.type === "pourcentage" ? (p.price * (1 - p.promo.value / 100)).toFixed(2) : Math.max(0, p.price - p.promo.value).toFixed(2)} €</strong> <span style={{ color: "var(--a-ink-3)", textDecoration: "line-through" }}>{p.price.toFixed(2)} €</span>
                  </div>
                )}
              </>
            )}
            {!p.promo && (
              <div className="neu-flat" style={{ padding: 12, borderRadius: 10, fontSize: 12, color: "var(--a-ink-3)", lineHeight: 1.5 }}>Aucune promotion active sur ce produit.</div>
            )}
          </div>
        )}

        {tab === "acompte" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div>
              <label className="fld-lbl" style={{ display: "block", marginBottom: 8 }}>Mode d'acompte</label>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
                {[["global","Global"],["custom","Personnalisé"],["none","Aucun"]].map(([v,l]) => {
                  const cur = p.acompteMode || "global";
                  return (
                    <button key={v} onClick={() => upd("acompteMode", v)} className={cur === v ? "neu-in-sm" : "neu-out-sm"} style={{ background: "var(--a-bg)", border: 0, padding: "9px", borderRadius: 9, fontSize: 12, fontWeight: cur === v ? 700 : 500, color: cur === v ? "var(--a-accent)" : "var(--a-ink-2)" }}>{l}</button>
                  );
                })}
              </div>
            </div>
            {p.acompteMode === "custom" && (
              <div><label className="fld-lbl" style={{ display: "block", marginBottom: 6 }}>Acompte (%)</label><input type="number" min="0" max="100" value={p.acompteValeur || ""} onChange={e => upd("acompteValeur", Number(e.target.value))}/></div>
            )}
            <div className="neu-flat" style={{ padding: 12, borderRadius: 10, fontSize: 12, color: "var(--a-ink-3)", lineHeight: 1.5 }}>
              {(!p.acompteMode || p.acompteMode === "global") && "Utilise le taux global défini dans Configuration."}
              {p.acompteMode === "none" && "Aucun acompte demandé pour ce produit."}
              {p.acompteMode === "custom" && p.acompteValeur > 0 && "Acompte spécifique de " + p.acompteValeur + " % appliqué à ce produit."}
            </div>
          </div>
        )}

        <div style={{ display: "flex", gap: 8, marginTop: 24 }}>
          <button onClick={() => onSave(p)} style={{ flex: 2, background: "var(--a-accent)", color: "#fff", border: 0, padding: "13px 18px", borderRadius: 12, fontWeight: 600, fontSize: 13, boxShadow: "-3px -3px 8px var(--a-hi), 4px 4px 10px var(--a-lo)" }}>
            {isNew ? "Créer le produit" : "Enregistrer"}
          </button>
          {!isNew && onDelete && (
            <button onClick={() => { if(window.confirm("Supprimer ce produit ?")) onDelete(p.id); }} className="neu-out-sm" style={{ background: "var(--a-bg)", color: "#c45a5a", border: 0, padding: "11px 14px", borderRadius: 12, fontWeight: 600, fontSize: 12 }}>
              <I.trash size={14}/>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}


/* ── STOCK ── */
function MAdminStock({ navigate, products, setProducts }) {
  const stock = products.filter(p => p.mode === "make_to_stock");
  const [delta, setDelta] = useStateMA({});

  function reappro(id) {
    const v = Number(delta[id] || 0); if (!v) return;
    setProducts(products.map(p => p.id === id ? { ...p, stock: (p.stock || 0) + v } : p));
    setDelta({ ...delta, [id]: "" });
  }
  function setAbs(id) {
    if (delta[id] === undefined || delta[id] === "") return;
    setProducts(products.map(p => p.id === id ? { ...p, stock: Number(delta[id]) } : p));
    setDelta({ ...delta, [id]: "" });
  }

  return (
    <MobilePage>
      <MobileTopbarLight onBack={() => navigate("admin/plus")} sub="Boutique" title="Stock"/>
      <div style={{ padding: "0 18px" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {stock.map(p => {
            const s = (p.stock || 0) < 5 ? "rupture" : (p.stock || 0) < 15 ? "faible" : "ok";
            const tones = { rupture: {c:"#c45a5a",l:"Rupture"}, faible: {c:"#c9954f",l:"Faible"}, ok: {c:"#1f8a5b",l:"En stock"} };
            const t = tones[s];
            return (
              <div key={p.id} className="a-card" style={{ padding: 14, borderRadius: 14 }}>
                <div style={{ display: "flex", gap: 12, alignItems: "center", marginBottom: 12 }}>
                  <div style={{ width: 48, height: 48, borderRadius: 10, backgroundImage: `url(${p.photo})`, backgroundSize: "cover", backgroundPosition: "center", flexShrink: 0 }}/>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 700, color: "var(--a-ink)" }}>{p.name}</div>
                    <div style={{ fontSize: 11, color: "var(--a-ink-3)" }}>{p.price.toFixed(2).replace(".",",")} €</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 22, fontWeight: 800, color: t.c, lineHeight: 1 }}>{p.stock || 0}</div>
                    <div style={{ fontSize: 9, color: "var(--a-ink-3)", letterSpacing: "0.06em", textTransform: "uppercase", fontWeight: 600 }}>{t.l}</div>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <div className="neu-in-sm" style={{ flex: 1, borderRadius: 10, padding: 0 }}>
                    <input type="number" value={delta[p.id] || ""} onChange={e => setDelta({...delta, [p.id]: e.target.value})}
                      placeholder="qté"
                      style={{ background: "transparent", border: 0, color: "var(--a-ink)", fontSize: 12.5, padding: "8px 12px", width: "100%", outline: 0, boxShadow: "none" }}/>
                  </div>
                  <button onClick={() => reappro(p.id)} className="neu-out-sm" style={{ background: "var(--a-bg)", color: "var(--a-accent)", border: 0, padding: "7px 11px", borderRadius: 9, fontSize: 11, fontWeight: 700, whiteSpace: "nowrap" }}>+ Réappro</button>
                  <button onClick={() => setAbs(p.id)} className="neu-out-sm" style={{ background: "var(--a-bg)", color: "var(--a-ink-2)", border: 0, padding: "7px 11px", borderRadius: 9, fontSize: 11, fontWeight: 700, whiteSpace: "nowrap" }}>Définir</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </MobilePage>
  );
}

              <div style={{ fontSize: 13, fontWeight: 700, color: "var(--a-ink)" }}>Hélène Spyfie</div>
              <div style={{ fontSize: 10.5, color: "var(--a-ink-3)" }}>Administratrice · helene@spyfie.fr</div>
            </div>
          </div>
          <button onClick={onLogout} className="neu-out-sm" style={{ width: "100%", background: "var(--a-bg)", color: "var(--a-ink-2)", border: 0, padding: "12px 14px", borderRadius: 12, fontSize: 12.5, fontWeight: 600 }}>
            Se déconnecter
          </button>
        </div>
      </div>
    </MobilePage>
  );
}

      <div style={{ padding: "0 18px" }}>
        <Section title="Mode de commande">
          <Field label="Mode global" hint="Directe, devis ou mixte au-delà d'un seuil.">
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6 }}>
              {[["direct_only","Directe"],["devis_only","Devis"],["seuil","Mixte"]].map(([v,l]) => (
                <button key={v} onClick={() => upd("modeCommande", v)} className={c.modeCommande === v ? "neu-in-sm" : "neu-out-sm"} style={{

                }}>{l}</button>
              ))}

          </Field>
          <Field label="Seuil de bascule" hint="Au-delà, devis personnalisé.">
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <input type="number" value={c.seuilPieces} onChange={e => upd("seuilPieces", Number(e.target.value))} style={{ maxWidth: 110 }}/>

        </Section>

        <Section title="Production">
          <Field label="Mode de production">
            <select value={c.modeProduction} onChange={e => upd("modeProduction", e.target.value)}>
              <option value="make_to_order">Sur commande</option>
              <option value="make_to_stock">En stock</option>
              <option value="mixte">Mixte</option>
            </select>
          </Field>
          <Field label="Délai de retrait min." hint="Avant retrait possible.">
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <input type="number" value={c.delaiRetrait} onChange={e => upd("delaiRetrait", Number(e.target.value))} style={{ maxWidth: 110 }}/>
              <span style={{ fontSize: 12, color: "var(--a-ink-3)" }}>jours</span>

          </Field>

            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

        </Section>

        <Section title="Devis">
          <Field label="Expiration">
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <input type="number" value={c.joursExpirationDevis} onChange={e => upd("joursExpirationDevis", Number(e.target.value))} style={{ maxWidth: 110 }}/>

            </div>

          <Field label="Mode d'acompte">

        <Section title="Notifications">

      </div>
    </MobilePage>
  );
}

Object.assign(window, { MLogin, MAdminDashboard, MAdminCommandes, MAdminDevis, MAdminCatalogue, MProductEditSheet, MAdminStock, MAdminPlus, MAdminConfig });


// MOBILE — Router

const { useState: useStateMApp, useEffect: useEffectMApp } = React;


function MobileApp() {
  const initial = (() => window.location.hash.slice(1) || "client/home")();
  const [route, setRoute] = useStateMApp(initial);

  useEffectMApp(() => {
    const onHash = () => setRoute(window.location.hash.slice(1) || "client/home");
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  // Sync body background to current section
  useEffectMApp(() => {
    const isA = route.startsWith("admin/");
    document.body.style.background = isA ? "#3a6344" : "#e8d9d0";
  }, [route]);

  const navigate = (p) => { window.location.hash = p; };

  // Cart + admin states
  const [cart, setCart] = useStateMApp([]);
  const [commandes, setCommandes] = useStateMApp(COMMANDES);
  const [devisList, setDevisList] = useStateMApp(DEVIS);
  const [products, setProducts] = useStateMApp(PRODUCTS);
  const [config, setConfig] = useStateMApp(CONFIG_DEFAULTS);

  window.__SEUIL_PIECES = config.seuilPieces;

  function addToCart(item) {
    setCart(prev => {
      const e = prev.find(it => it.id === item.id);
      if (e) return prev.map(it => it.id === item.id ? { ...it, qty: it.qty + item.qty } : it);
      return [...prev, item];
    });
  }
  function updateQty(id, qty) { setCart(prev => prev.map(it => it.id === id ? { ...it, qty } : it)); }
  function removeItem(id) { setCart(prev => prev.filter(it => it.id !== id)); }
  function clearCart() { setCart([]); }


  const cartCount = cart.reduce((s, it) => s + it.qty, 0);
  const isClient = route.startsWith("client/");
  const isAdmin = route.startsWith("admin/") && route !== "admin/login";

  // Bottom nav items
  const clientNavItems = [
    { id: "client/home", label: "Accueil", icon: <I.home size={20}/> },
    { id: "client/catalogue", label: "Shop", icon: <I.layers size={20}/> },
    { id: "client/cart", label: "Panier", icon: <I.cart size={20}/>, badge: cartCount },
    { id: "client/contact", label: "Contact", icon: <I.phone size={20}/> },
  ];
  const adminNavItems = [
    { id: "admin/dashboard", label: "Dashboard", icon: <I.home size={20}/> },
    { id: "admin/commandes", label: "Commandes", icon: <I.package size={20}/> },
    { id: "admin/devis", label: "Devis", icon: <I.document size={20}/> },
    { id: "admin/catalogue", label: "Catalogue", icon: <I.layers size={20}/> },
    { id: "admin/plus", label: "Plus", icon: <I.menu size={20}/> },
  ];

  // Map sub-pages back to the active tab
  const clientCurrent =
    route === "client/checkout" ? "client/cart"
    : (route === "client/confirm-direct") ? "client/cart"
    : (route === "client/confirm-devis") ? "client/contact"
    : (route === "client/devis") ? "client/contact"
    : route;
  const adminCurrent =
    (route === "admin/stock" || route === "admin/config") ? "admin/plus"
    : route;

  let page;
  switch (route) {
    case "client/home":           page = <MHome navigate={navigate}/>; break;
    case "client/catalogue":      page = <MCatalogue navigate={navigate} addToCart={addToCart}/>; break;
    case "client/cart":           page = <MCart navigate={navigate} cart={cart} updateQty={updateQty} removeItem={removeItem}/>; break;
    case "client/checkout":       page = <MCheckout navigate={navigate} cart={cart} clearCart={clearCart}/>; break;
    case "client/devis":          page = <MDevis navigate={navigate} cart={cart} clearCart={clearCart}/>; break;
    case "client/confirm-direct": page = <MConfirm navigate={navigate} kind="direct"/>; break;
    case "client/confirm-devis":  page = <MConfirm navigate={navigate} kind="devis"/>; break;
    case "admin/login":           page = <MLogin navigate={navigate} onLogin={() => {}}/>; break;
    case "client/contact":        page = <MContact navigate={navigate}/>; break;
    case "admin/dashboard":       page = <MAdminDashboard navigate={navigate} commandes={commandes} setCommandes={setCommandes} devis={devisList} setDevis={setDevisList}/>; break;
    case "admin/commandes":       page = <MAdminCommandes navigate={navigate} commandes={commandes} setCommandes={setCommandes}/>; break;
    case "admin/devis":           page = <MAdminDevis navigate={navigate} devis={devisList} setDevis={setDevisList}/>; break;
    case "admin/catalogue":       page = <MAdminCatalogue navigate={navigate} products={products} setProducts={setProducts}/>; break;
    case "admin/stock":           page = <MAdminStock navigate={navigate} products={products} setProducts={setProducts}/>; break;
    case "admin/plus":            page = <MAdminPlus navigate={navigate} onLogout={() => navigate("admin/login")}/>; break;
    case "admin/config":          page = <MAdminConfig navigate={navigate} config={config} setConfig={setConfig}/>; break;
    default:                      page = <MHome navigate={navigate}/>;
  }

  return (
    <>
      <PhoneFrame dark={isClient}>
        {page}
        {isClient && (
          <BottomNav items={clientNavItems} current={clientCurrent} onNavigate={navigate} dark={true}/>
        )}
        {isAdmin && (
          <BottomNav items={adminNavItems} current={adminCurrent} onNavigate={navigate} dark={false}/>
        )}
      </PhoneFrame>

    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MobileApp/>);

</script>
